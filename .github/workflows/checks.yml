# Lint, type check and build on every PR, so a dependency bump has a real
# signal instead of only a bot's opinion.
#
# Lint runs eslint directly rather than through `next lint`: Next 14's wrapper
# looks for an .eslintrc and does not recognise this repo's flat config, so it
# drops into an interactive setup prompt and would hang a runner.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
